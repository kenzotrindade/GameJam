<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bushido Showdown</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="htmlMenuOverlay">
      <h1>BUSHIDO</h1>

      <div class="characterSelect">
        <section id="p1Controls">
          <h3>Joueur 1</h3>
          <article>
            <h4>Bushido Rouge</h4>
            <img src="/img/samourai.png" alt="Premier Samourai" />
            <button onclick="selectP1('red')">Rouge</button>
          </article>
          <article>
            <h4>Bushido Vert</h4>
            <img src="/img/samourai2.png" alt="Deuxieme Samourai" />
            <button onclick="selectP1('emerald')">Vert</button>
          </article>
        </section>

        <section id="p2Controls">
          <h3>Joueur 2</h3>
          <article>
            <h4>Bushido Rouge</h4>
            <img src="/img/samourai.png" alt="Premier Samourai" />
            <button onclick="selectP1('red')">Rouge</button>
          </article>
          <article>
            <h4>Bushido Vert</h4>
            <img src="/img/samourai2.png" alt="Deuxieme Samourai" />
            <button onclick="selectP1('emerald')">Vert</button>
          </article>
        </section>
      </div>

      <button id="startBtn" onclick="startGame()">COMBATTRE !</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
